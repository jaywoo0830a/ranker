[project]
name = "ranker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "=", email = "=" }
]
requires-python = ">=3.14.4"
dependencies = [
    "playwright==1.58.0",
    "pydantic>=2.9",
    "pyyaml>=6",
]

[project.scripts]
ranker = "ranker:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

version: 1

schedule:
  count: 3
  interval: 60min
  start: immediate

source:
  kind: naver_unified_search
  locator:
    type: css
    value: div.spw_rerank._slog_visible
  scan_depth: 10

matching:
  by: blog_id

targets:
  source: file
  path: examples/posts.yaml

output:
  path: examples/ranks.yaml
  mode: append

behavior:
  dwell_ms:           { min: 4000, max: 10000 }
  mouse_events:       { min: 5,    max: 15    }
  keystroke_delay_ms: { min: 80,   max: 180   }
  inter_search_s:     { min: 30,   max: 90    }

identity:
  locale: ko-KR
  timezone: Asia/Seoul
  viewport: { width: 1280, height: 800 }
  rotate_context: per_run

version: 1

# 운영 매니페스트 — 4 Job 병렬 (desktop 2 + mobile 2),
# ProxyEmpire 모바일 IP, 매칭된 포스트는 post_visit dwell 수행.
#
# 실행 전:
#   cp .env.example .env
#   # .env 에서 PROXYEMPIRE_USERNAME / PROXYEMPIRE_PASSWORD 채움
#   set -a; source .env; set +a
#   ranker examples/prod.yaml
#
# 결과:
#   - examples/ranks.yaml        (랭크 결과, append)
#   - examples/cache_stats.yaml  (캐시 절감 통계, run 종료 시 자동 생성)
# 각 run dict 는 job/mode 태그 — 측정 출처 식별용.

schedule:
  count: 24
  interval: 1h
  start: immediate

source:
  kind: naver_unified_search
  scan_depth: 10

targets:
  source: file
  path: examples/posts.yaml

output:
  path: examples/ranks.yaml
  mode: append

proxy:
  provider: proxyempire
  host: v2.proxyempire.io
  port: 5000
  country: kr
  session_ttl: 30m

# 트래픽 절감 — 3 레이어:
#   • block: 정적 자산 (image/font/media/stylesheet) 페이지 단계 차단.
#     랭킹은 HTML anchor 기반, dwell 은 시간 기반 → 영향 없음.
#   • block_third_party_trackers: 광고/분석 트래커 차단. naver 1st-party
#     는 항상 통과 (정상 사용자 + adblock 수준).
#   • cache: pstatic.net script 응답 디스크 캐시. 4 Job 이 디렉토리
#     공유 → 한 Job 이 받으면 나머지 3 Job 은 디스크 hit (네트워크 도달 0).
#     run 사이에도 유지 — 24h max_ttl 안에서는 Cache-Control 만료 전엔
#     재요청 안 함. anti-cache 헤더 (no-store/Set-Cookie/제한적 Vary)
#     는 fallback 모드에서도 무조건 거부 — 개인화 응답 절대 캐시 안 함.
#   • cache.dir 미명시 → 기본 .ranker-cache (CWD 상대). 웹 업로드 시엔
#     서버가 .shared-cache 로 자동 덮어씀.
# 통계는 run 종료 로그 + cache_stats.yaml 파일에 기록.
resources:
  block: [image, font, media, stylesheet]
  block_third_party_trackers: true
  cache:
    enabled: true
    domains: [pstatic.net]
    max_ttl: 7d         # pstatic versioned URL 은 immutable, 7일 캡 안전
    fallback_ttl: 24h   # Cache-Control 없는 응답도 24h 캐시

# 각 Job이 자체 sticky session → 자체 IP. 4 Job 동시 = 4 IP 동시.
jobs:
  - { name: desktop-1, mode: desktop }
  - { name: desktop-2, mode: desktop }
  - { name: mobile-1,  mode: mobile  }
  - { name: mobile-2,  mode: mobile  }

behavior:
  dwell_ms:           { min: 10000, max: 20000 }
  mouse_events:       { min: 5,     max: 15    }
  keystroke_delay_ms: { min: 80,    max: 180   }
  inter_search_s:     { min: 30,    max: 90    }

post_visit:
  enabled: true
  dwell_ms:     { min: 160000, max: 200000 }
  mouse_events: { min: 20,     max: 60     }
  scroll:
    depth_ratio: { min: 0.7, max: 0.95 }
    down_bias:   0.85

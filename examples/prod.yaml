version: 1

# 운영 매니페스트 — 4 Job 병렬 (desktop 2 + mobile 2),
# ProxyEmpire 모바일 IP, 매칭된 포스트는 post_visit dwell 수행.
#
# 실행 전:
#   cp .env.example .env
#   # .env 에서 PROXYEMPIRE_USERNAME / PROXYEMPIRE_PASSWORD 채움
#   set -a; source .env; set +a
#   ranker examples/prod.yaml
#
# 결과는 examples/ranks.yaml 에 누적 (append). 각 run dict는 job/mode 태그.

schedule:
  count: 24
  interval: 1h
  start: immediate

source:
  kind: naver_unified_search
  scan_depth: 10

targets:
  source: file
  path: examples/posts.yaml

output:
  path: examples/ranks.yaml
  mode: append

proxy:
  provider: proxyempire
  host: v2.proxyempire.io
  port: 5000
  country: kr
  session_ttl: 30m

# 프록시 트래픽 절감 — 페이지 단계에서 이미지/폰트/미디어/광고 트래커 차단.
# rank 파싱과 dwell 동작에는 영향 없음 (HTML anchor + DOM 기반).
# 차단 통계는 각 Job 종료 로그에 'blocked X of Y requests' 로 표시됨.
resources:
  block: [image, font, media]
  block_third_party_trackers: true

# 각 Job이 자체 sticky session → 자체 IP. 4 Job 동시 = 4 IP 동시.
jobs:
  - { name: desktop-1, mode: desktop }
  - { name: desktop-2, mode: desktop }
  - { name: mobile-1,  mode: mobile  }
  - { name: mobile-2,  mode: mobile  }

behavior:
  dwell_ms:           { min: 10000, max: 20000 }
  mouse_events:       { min: 5,     max: 15    }
  keystroke_delay_ms: { min: 80,    max: 180   }
  inter_search_s:     { min: 30,    max: 90    }

post_visit:
  enabled: true
  dwell_ms:     { min: 160000, max: 200000 }
  mouse_events: { min: 20,     max: 60     }
  scroll:
    depth_ratio: { min: 0.7, max: 0.95 }
    down_bias:   0.85

version: 1

# 운영 환경 스모크 테스트 — 프록시 통합 검증용.
# - 1회만 실행 (count: 1)
# - post_visit 비활성화 (전체 흐름은 prod.yaml에서)
# - behavior 파라미터를 짧게 (수십 초 안에 완료)
# - 결과는 examples/ranks_smoke.yaml 에 overwrite
#
# 실행 전 환경변수 필수:
#   export PROXYEMPIRE_USERNAME=m_xxxxxxxxxx
#   export PROXYEMPIRE_PASSWORD=xxxxxxxxxx
#
# 추천 실행 흐름:
#   1) scripts/probe_proxy.py 로 프록시 연결 확인
#   2) 이 매니페스트로 풀 파이프라인 (검색 + 매칭) 확인
#   3) 정상이면 prod.yaml 로 본 운영 실행

mode: desktop

schedule:
  count: 1
  interval: 60min
  start: immediate

source:
  kind: naver_unified_search
  scan_depth: 10

matching:
  by: blog_id

targets:
  source: file
  path: examples/posts.yaml

output:
  path: examples/ranks_smoke.yaml
  mode: overwrite

proxy:
  provider: proxyempire
  host: v2.proxyempire.io
  port: 5000
  country: kr
  session_ttl: 30m

behavior:
  dwell_ms:           { min: 500,  max: 1500 }
  mouse_events:       { min: 2,    max: 4    }
  keystroke_delay_ms: { min: 40,   max: 120  }
  inter_search_s:     { min: 2,    max: 5    }

identity:
  locale: ko-KR
  timezone: Asia/Seoul
  rotate_context: per_run

post_visit:
  enabled: false

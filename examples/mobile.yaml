version: 1

# mobile 모드: m.naver.com 진입, 모바일 UA, 414x896 viewport, 터치 on.
# 셀렉터(source.sections)와 search_input은 프로필 기본값을 사용하므로
# 이 파일에는 명시하지 않는다. 기본값이 모바일 DOM과 맞지 않으면
# scripts/probe_mobile.py 를 실행해서 실제 셀렉터를 확인 후 source.sections
# 를 매니페스트에 직접 추가해서 override 하면 된다.

mode: mobile

schedule:
  count: 1
  interval: 60min
  start: immediate

source:
  kind: naver_unified_search
  scan_depth: 10
  # sections: 프로필 기본값 사용

matching:
  by: blog_id

targets:
  source: file
  path: examples/posts.yaml

output:
  path: examples/ranks_mobile.yaml
  mode: overwrite

behavior:
  dwell_ms:           { min: 10000, max: 20000 }
  mouse_events:       { min: 5,     max: 15    }
  keystroke_delay_ms: { min: 80,    max: 180   }
  inter_search_s:     { min: 30,    max: 90    }

identity:
  locale: ko-KR
  timezone: Asia/Seoul
  # viewport: 프로필 기본값(414x896) 사용
  rotate_context: per_run

post_visit:
  enabled: true
  dwell_ms:     { min: 160000, max: 200000 }
  mouse_events: { min: 20,     max: 60     }
  scroll:
    depth_ratio: { min: 0.7, max: 0.95 }
    down_bias:   0.85

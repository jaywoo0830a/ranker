version: 1

# 멀티-Job 매니페스트 예시.
#
# 'jobs:' 블록이 있으면 각 항목마다 별도 Job이 생성된다. Job은 자체
# BrowserContext + 자체 sticky 세션(SID) + 자체 IP를 가지므로 4 Job =
# 동시 4 IP. 각 Job은 mode만 override 가능 (지금은) — 나머지(스케줄,
# 소스, 매칭, 타겟, 출력, 프록시, identity/behavior/post_visit 기본값)는
# 매니페스트 최상위에서 공유된다.
#
# 'jobs:' 블록이 없으면 매니페스트는 단일 implicit Job ("default")으로
# 동작 — 기존 매니페스트(dev/prod/prod_smoke)는 그대로 호환.
#
# 주의: 본 매니페스트는 DSL 정의 단계의 예시. runner는 아직 jobs를
# 직렬 / 병렬로 실행하지 않는다 (다음 작업에서 통합).

mode: desktop                   # 'jobs:' 항목에서 mode 미지정 시 기본값

schedule:
  count: 1
  interval: 30min
  start: immediate

source:
  kind: naver_unified_search
  scan_depth: 10

matching:
  by: blog_id

targets:
  source: file
  path: examples/posts.yaml

output:
  path: examples/ranks_jobs.yaml
  mode: append

proxy:
  provider: proxyempire
  host: v2.proxyempire.io
  port: 5000
  country: kr
  session_ttl: 30m

# 4 Job: 데스크탑 2개 + 모바일 2개. 각 Job 다른 IP 자동 할당.
jobs:
  - { name: desktop-1, mode: desktop }
  - { name: desktop-2, mode: desktop }
  - { name: mobile-1,  mode: mobile  }
  - { name: mobile-2,  mode: mobile  }

behavior:
  dwell_ms:           { min: 10000, max: 20000 }
  mouse_events:       { min: 5,     max: 15    }
  keystroke_delay_ms: { min: 80,    max: 180   }
  inter_search_s:     { min: 30,    max: 90    }

identity:
  locale: ko-KR
  timezone: Asia/Seoul
  rotate_context: per_run

post_visit:
  enabled: false

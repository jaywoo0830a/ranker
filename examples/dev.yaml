version: 1

# 로컬 검증용 — 프록시 없이 1회 실행, 빠른 행동.
# 실행:
#   ranker examples/dev.yaml
# 결과는 examples/ranks.yaml 에 기록.
# 운영 매니페스트(병렬 4 Job + 프록시 + post_visit)는 examples/prod.yaml 참고.

schedule:
  count: 1
  interval: 60min

source:
  kind: naver_unified_search
  scan_depth: 10

targets:
  source: file
  path: examples/posts.yaml

output:
  path: examples/ranks.yaml
  mode: overwrite

behavior:
  dwell_ms:           { min: 500,  max: 1500 }
  mouse_events:       { min: 2,    max: 4    }
  keystroke_delay_ms: { min: 40,   max: 120  }
  inter_search_s:     { min: 2,    max: 5    }

# Production webapp serving — static SPA + reverse proxy /api/* to the
# API container. Service name `api` is the docker-compose hostname.

# WebSocket Upgrade 매핑. /api/jobs/{id}/logs/stream 이 WebSocket 이라
# 클라이언트가 보낸 ``Upgrade: websocket`` 을 백엔드로 그대로 넘겨야 함.
# 이 map 은 nginx 의 http{} context 에 있어야 하는데, 본 파일이
# /etc/nginx/conf.d/default.conf 로 include 되는 위치가 정확히 http{}
# 내부라 여기 두면 동작함.
# 일반 HTTP 요청은 ``Connection: close``, WS 요청만 ``upgrade`` 로 매핑.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: forward to the api service on the compose network.
    location /api/ {
        proxy_pass http://api:8000;

        # WebSocket support — required for /api/jobs/{id}/logs/stream.
        # 없으면 nginx 가 HTTP/1.0 으로 upstream 에 가서 Upgrade 못 보냄
        # → 클라이언트는 onopen 직후 onclose 만 받고 빈 화면.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Job 의 전체 수명 동안 WS 가 열려있을 수 있음 (start 대기 +
        # run 5 회 × 30분 = 2~3시간). HTTP 폴링용 짧은 타임아웃은
        # 부족 → 24h 로 크게 잡음. 일반 HTTP 요청도 같은 location 이라
        # 같이 적용되지만 업로드/폴링은 어차피 빨리 끝나서 무해.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 로그 스트림은 작은 chunk 가 자주 옴 — buffering 끄면 즉시
        # 클라이언트에 도달.
        proxy_buffering off;
    }

    # SPA history fallback — any unknown path returns index.html so the
    # client-side router (or a future one) can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip text assets — cheap CDN-style optimization.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/yaml text/yaml image/svg+xml;
    gzip_min_length 1024;
}

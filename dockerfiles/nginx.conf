# Production webapp serving — static SPA + reverse proxy /api/* to the
# API container. Service name `api` is the docker-compose hostname.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: forward to the api service on the compose network.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-running uploads + log polling — generous timeouts.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA history fallback — any unknown path returns index.html so the
    # client-side router (or a future one) can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip text assets — cheap CDN-style optimization.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/yaml text/yaml image/svg+xml;
    gzip_min_length 1024;
}
